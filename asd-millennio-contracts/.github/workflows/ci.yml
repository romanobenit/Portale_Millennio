name: Contracts CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: asd-millennio-contracts/package.json

      - name: Install dependencies
        run: |
          cd asd-millennio-contracts
          npm install

      - name: Compile contracts
        run: |
          cd asd-millennio-contracts
          npm run compile

      - name: Run tests
        run: |
          cd asd-millennio-contracts
          npm test

      - name: Coverage ≥ 95%
        run: |
          cd asd-millennio-contracts
          npx hardhat coverage --check-coverage --lines 95 --functions 95 --branches 90
